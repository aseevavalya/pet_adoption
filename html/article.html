<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статья — МЫ ЗДЕСЬ</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/articles.css">
</head>

<body class="page-articles page-article-detail">
  <div id="site-nav"></div>

  <main class="articles-page article-page-dark">
    <section class="article-hero">
      <div class="container article-hero-inner">
        <span class="section-kicker article-hero-badge" id="articleBadge">Статья</span>
        <h1 class="section-title article-hero-title" id="articleTitle">Загрузка...</h1>
        <p class="section-lead article-hero-lead" id="articleExcerpt"></p>

        <div class="article-hero-media">
          <img id="articleImage" src="img/about-project.png" alt="Статья">
        </div>
      </div>
    </section>

    <section class="article-body-section">
      <div class="container">
        <article class="article-detail-card article-detail-card--centered">
          <div id="articleContent"></div>
        </article>
      </div>
    </section>

    <div class="bottom-home-wrap">
      <div class="container">
        <a class="bottom-home-bar" href="articles.html">
          <span class="bottom-home-icon" aria-hidden="true"></span>
          <span class="bottom-home-text">Назад к статьям</span>
        </a>
      </div>
    </div>
  </main>

  <script src="js/include-nav.js"></script>
  <script src="js/main.js"></script>
  <script src="js/article-detail.js"></script>
</body>
</html>
