<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход администратора — МЫ ЗДЕСЬ</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">

  <style>
    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px var(--page-gutter);
      background: #f4f1eb;
    }

    .login-card {
      width: min(100%, 460px);
      background: #fff;
      border: 1px solid rgba(35, 38, 44, 0.08);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(24, 26, 31, 0.08);
    }

    .login-kicker {
      display: inline-block;
      margin-bottom: 10px;
      color: rgba(31, 35, 40, 0.55);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .login-title {
      margin-bottom: 10px;
      font-size: 32px;
      font-weight: var(--font-weight-bold);
      line-height: 1.1;
      color: #1f2328;
    }

    .login-lead {
      margin-bottom: 24px;
      color: rgba(31, 35, 40, 0.7);
      line-height: 1.6;
    }

    .login-form {
      display: grid;
      gap: 16px;
    }

    .login-field {
      display: grid;
      gap: 8px;
    }

    .login-field span {
      font-size: 14px;
      font-weight: 600;
      color: #1f2328;
    }

    .login-input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(35, 38, 44, 0.1);
      border-radius: 16px;
      background: #faf7f2;
      color: #1f2328;
      font: inherit;
    }

    .login-btn {
      min-height: 50px;
      border: 0;
      border-radius: 999px;
      background: #1f2328;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .login-btn:hover {
      transform: translateY(-1px);
    }

    .login-status {
      min-height: 22px;
      font-size: 14px;
      color: rgba(31, 35, 40, 0.72);
    }

    .login-status.is-error {
      color: #a53b37;
    }

    .login-status.is-success {
      color: #1f7a4f;
    }

    .login-back {
      display: inline-flex;
      align-items: center;
      margin-top: 18px;
      color: rgba(31, 35, 40, 0.72);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <span class="login-kicker">служебный вход</span>
      <h1 class="login-title">Вход администратора</h1>
      <p class="login-lead">
        Войдите в панель управления, чтобы редактировать животных, статьи и страницы сайта.
      </p>

      <form class="login-form" id="adminLoginForm">
        <label class="login-field">
          <span>Логин</span>
          <input class="login-input" type="text" name="username" autocomplete="username" required>
        </label>

        <label class="login-field">
          <span>Пароль</span>
          <input class="login-input" type="password" name="password" autocomplete="current-password" required>
        </label>

        <button class="login-btn" type="submit" id="adminLoginBtn">Войти</button>
        <p class="login-status" id="adminLoginStatus"></p>
      </form>

      <a class="login-back" href="index.html">Вернуться на сайт</a>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
