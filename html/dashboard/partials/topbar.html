<div class="dashboard-topbar">
  <div class="dashboard-topbar__left">
    <button
      class="dashboard-menu-toggle"
      id="dashboardMenuToggle"
      type="button"
      aria-label="Открыть меню"
    >
      ☰
    </button>

    <div>
      <h1 class="dashboard-topbar__title dashboard-topbar__title--single" id="dashboardPageTitle">
        Административная панель
      </h1>
    </div>
  </div>

  <div class="dashboard-topbar__actions">
    <button
      class="dashboard-icon-btn dashboard-icon-btn--logout"
      id="dashboardLogoutBtn"
      type="button"
      aria-label="Выйти"
      title="Выйти"
    >
      <img src="img/exit.svg">
    </button>
  </div>
</div>
