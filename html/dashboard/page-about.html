<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>О нас — Панель</title>

  <link rel="stylesheet" href="css/dashboard-base.css" />
  <link rel="stylesheet" href="css/dashboard-layout.css" />
  <link rel="stylesheet" href="css/dashboard-components.css" />
  <link rel="stylesheet" href="css/dashboard-form.css" />
  <link rel="stylesheet" href="css/dashboard-pages.css" />
</head>
<body class="dashboard-body" data-dashboard-page="dashboard-page-about">
  <div class="dashboard-shell">
    <div id="dashboardSidebarMount"></div>

    <main class="dashboard-main">
      <div id="dashboardTopbarMount"></div>

      <section class="dashboard-content">
        <article class="dashboard-card dashboard-card--padded">
          <div class="dashboard-toolbar">
            <div>
              <h2 class="dashboard-section-title">Страница «О нас»</h2>
              <p class="dashboard-section-lead">
                Здесь можно редактировать только основной текстовый блок страницы.
                Иллюстрация и правый смысловой блок сейчас статичны.
              </p>
            </div>
          </div>
        </article>

        <form class="dashboard-form" id="aboutPageForm">
          <article class="dashboard-card dashboard-card--padded dashboard-edit-card">
            <div class="dashboard-edit-card__head">
              <div>
                <h3 class="dashboard-form-section-title">Кто мы такие</h3>
                <p class="dashboard-section-lead">
                  Этот текст отображается в сером блоке на публичной странице.
                </p>
              </div>

              <button class="dashboard-ghost-btn" type="button" data-toggle-block="aboutStoryEditor">
                Редактировать
              </button>
            </div>

            <div class="dashboard-preview-block dashboard-preview-block--text">
              <div class="dashboard-preview-block__mini-title">О ПРОЕКТЕ</div>
              <div class="dashboard-preview-block__title dashboard-preview-block__title--about">
                Кто мы такие
              </div>
              <div class="dashboard-preview-block__rich" id="aboutPreviewStoryContent">—</div>
            </div>

            <div class="dashboard-edit-panel" id="aboutStoryEditor" hidden>
              <div class="dashboard-form-grid">
                <label class="dashboard-field dashboard-field--full">
                  <span>Текст блока</span>
                  <textarea
                    class="dashboard-textarea dashboard-richtext"
                    name="story_content"
                    id="story_content"
                    rows="12"
                  ></textarea>
                </label>
              </div>
            </div>
          </article>

          <div class="dashboard-form-actions">
            <button class="dashboard-btn" type="submit" id="aboutPageSubmitBtn">
              Сохранить
            </button>
          </div>

          <p class="dashboard-form-status" id="aboutPageFormStatus"></p>
        </form>
      </section>
    </main>
  </div>

  <script src="js/tinymce/tinymce.min.js"></script>
  <script src="js/dashboard-api.js"></script>
  <script src="js/dashboard-auth.js"></script>
  <script>
    requireDashboardAuth();
  </script>
  <script src="js/dashboard-main.js"></script>
  <script src="js/dashboard-page-about.js"></script>
</body>
</html>
