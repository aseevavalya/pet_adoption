<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявки — Панель</title>

  <link rel="stylesheet" href="css/dashboard-base.css">
  <link rel="stylesheet" href="css/dashboard-layout.css">
  <link rel="stylesheet" href="css/dashboard-components.css">
  <link rel="stylesheet" href="css/dashboard-requests.css">
</head>
<body class="dashboard-body" data-dashboard-page="dashboard-requests">
  <div class="dashboard-shell">
    <div id="dashboardSidebarMount"></div>

    <main class="dashboard-main">
      <div id="dashboardTopbarMount"></div>

      <section class="dashboard-content">
        <article class="dashboard-card dashboard-card--padded">
          <div class="dashboard-toolbar">
            <div>
              <h2 class="dashboard-section-title">Все заявки</h2>
            </div>
          </div>
        </article>

        <article class="dashboard-card dashboard-card--padded">
          <div class="dashboard-filters">
            <input
              class="dashboard-input dashboard-input--inline"
              id="requestsSearch"
              type="text"
              placeholder="Поиск по имени, телефону, email, городу, животному"
            >

            <select class="dashboard-select" id="requestsStatusFilter">
              <option value="">Все статусы</option>
              <option value="new">Новая</option>
              <option value="in_progress">В работе</option>
              <option value="contacted">Связались</option>
              <option value="approved">Одобрено</option>
              <option value="rejected">Отказ</option>
              <option value="closed">Закрыта</option>
            </select>
          </div>
        </article>

        <article class="dashboard-card dashboard-card--padded">
          <div class="dashboard-list" id="requestsList">
            <p class="dashboard-empty">Загружаем заявки...</p>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script src="js/dashboard-api.js"></script>
  <script src="js/dashboard-auth.js"></script>
  <script>
    requireDashboardAuth();
  </script>
  <script src="js/dashboard-main.js"></script>
  <script src="js/dashboard-requests.js"></script>
</body>
</html>
